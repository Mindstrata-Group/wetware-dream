# Contributor License Agreement (CLA.md). The project is dual-licensed
# (AGPL-3.0 and a commercial license), so every contributor grants the
# maintainers the right to relicense their contribution. The bot asks for a
# one-line comment once per contributor and stores signatures in the
# cla-signatures branch of this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.repository == 'Mindstrata-Group/wetware-dream'
    runs-on: ubuntu-latest
    steps:
      - if: github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Mindstrata-Group/wetware-dream/blob/main/CLA.md
          branch: cla-signatures
          # Maintainers are the copyright holders' side of the CLA and do not
          # sign it themselves. The allowlist matches GitHub logins, so their
          # commit e-mail must be linked to their GitHub account.
          allowlist: kocmocgim,k19mar,dependabot[bot],github-actions[bot]
